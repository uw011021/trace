<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>校服 · 主人绑定</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #e8f4f8 0%, #f0f7ff 50%, #e6f0ff 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #fff;
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            padding: 24px 20px 20px;
        }
        .header {
            text-align: center;
            padding-bottom: 18px;
            border-bottom: 1px solid #ecf3f8;
        }
        .header .logo {
            font-size: 24px;
            font-weight: 700;
            color: #1a3a5c;
            letter-spacing: 3px;
        }
        .header .sub {
            font-size: 13px;
            color: #5a7a8a;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .qrcard {
            background: #f5faff;
            border-radius: 20px;
            padding: 20px 16px 16px;
            text-align: center;
            margin: 20px 0 18px;
            border: 1px solid #dae8f0;
        }
        .qrcard p {
            font-weight: 600;
            color: #1a3a5c;
            font-size: 15px;
            margin-bottom: 8px;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 6px auto 10px;
        }
        .code-info {
            background: #e3edf5;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            color: #1a3a5c;
            display: inline-block;
            word-break: break-all;
            font-weight: 500;
        }
        .qr-hint {
            font-size: 12px;
            color: #5a7a8a;
            margin-top: 6px;
        }
        .qr-fixed-hint {
            font-size: 11px;
            color: #7a9aaa;
            margin-top: 4px;
            background: #e8f0f5;
            padding: 2px 12px;
            border-radius: 12px;
            display: inline-block;
        }

        .owner-card {
            background: #f5faff;
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 20px;
            border-left: 5px solid #2c5f8a;
            min-height: 80px;
        }
        .empty-state {
            color: #7a8f9f;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
            padding: 6px 0;
        }
        .owner-detail {
            font-size: 14px;
            padding: 8px 0;
            border-bottom: 1px dashed #d0dfe8;
        }
        .owner-detail:last-child {
            border-bottom: none;
        }
        .owner-label {
            font-weight: 600;
            color: #1a3a5c;
            display: inline-block;
            width: 80px;
        }
        .owner-value {
            color: #1f3b4f;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            color: #1a3a5c;
            font-size: 13px;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #dae8f0;
            border-radius: 14px;
            font-size: 14px;
            background: #ffffff;
            transition: 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #2c5f8a;
            box-shadow: 0 0 0 3px rgba(44, 95, 138, 0.08);
        }
        .password-hint {
            font-size: 11px;
            color: #7a9aaa;
            margin-top: 4px;
            padding-left: 4px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 6px;
        }
        .btn {
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.15s;
            width: 100%;
            letter-spacing: 1px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2c5f8a, #1a3a5c);
            color: #fff;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(44, 95, 138, 0.25);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            transform: none;
            box-shadow: none;
        }
        .btn-reset {
            background: #edf2f7;
            color: #4a5f6f;
            border: 1px solid #d0dfe8;
        }
        .btn-reset:hover {
            background: #e2eaf0;
        }

        .alert {
            background: #e0f2e9;
            border-radius: 14px;
            padding: 12px 16px;
            margin-top: 16px;
            font-size: 13px;
            display: none;
            align-items: center;
            gap: 8px;
            color: #166534;
        }

        .footer {
            text-align: center;
            padding: 16px 0 6px;
            font-size: 12px;
            color: #8899aa;
            border-top: 1px solid #ecf3f8;
            margin-top: 18px;
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid #d0dfe8;
            border-top: 2.5px solid #2c5f8a;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ---------- 密码验证模态框 ---------- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(4px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #ffffff;
            border-radius: 28px;
            padding: 32px 24px 24px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            0% {
                transform: scale(0.92);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .modal-box h3 {
            font-size: 20px;
            color: #1a3a5c;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-box .modal-desc {
            font-size: 14px;
            color: #5a7a8a;
            margin-bottom: 18px;
            line-height: 1.5;
        }
        .modal-box .modal-input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #dae8f0;
            border-radius: 14px;
            font-size: 16px;
            background: #f9fcff;
            margin-bottom: 18px;
        }
        .modal-box .modal-input:focus {
            outline: none;
            border-color: #2c5f8a;
            box-shadow: 0 0 0 3px rgba(44, 95, 138, 0.08);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
        }
        .modal-actions .btn {
            flex: 1;
            padding: 12px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: 0.15s;
        }
        .modal-actions .btn-confirm {
            background: linear-gradient(135deg, #2c5f8a, #1a3a5c);
            color: #fff;
        }
        .modal-actions .btn-confirm:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(44, 95, 138, 0.25);
        }
        .modal-actions .btn-cancel {
            background: #edf2f7;
            color: #4a5f6f;
            border: 1px solid #d0dfe8;
        }
        .modal-actions .btn-cancel:hover {
            background: #e2eaf0;
        }
        .modal-error {
            color: #b33;
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 14px;
            display: none;
            background: #fee8e8;
            padding: 8px 14px;
            border-radius: 10px;
        }
        .modal-error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <div class="logo">🎒</div>
            <div class="sub">校服主人绑定 · 云端存储</div>
        </div>

        <div class="qrcard">
            <p>📌 校服唯一溯源码</p>
            <div id="qrcode"></div>
            <div style="margin: 6px 0 4px;">
                <span class="code-info" id="uniformIdDisplay">加载中...</span>
            </div>
            <div class="qr-hint">👆 扫码分享 · 他人扫码可联系归还</div>
            <div class="qr-fixed-hint">🔗 二维码包含校服ID，扫码自动匹配数据</div>
        </div>

        <div class="owner-card" id="ownerInfoPanel">
            <div class="empty-state"><span class="loading"></span> 加载云端数据...</div>
        </div>

        <div class="form-group">
            <label>👤 学生姓名 *</label>
            <input type="text" id="ownerName" placeholder="例: 张明轩" autocomplete="off">
        </div>
        <div class="form-group">
            <label>🏫 班级</label>
            <input type="text" id="ownerClass" placeholder="例: 五年级(3)班" autocomplete="off">
        </div>
        <div class="form-group">
            <label>📞 联系电话 *</label>
            <input type="tel" id="ownerPhone" placeholder="家长或老师手机号" autocomplete="off">
        </div>
        <!-- 新增：安全密码 -->
        <div class="form-group">
            <label>🔑 安全密码 *</label>
            <input type="password" id="ownerPassword" placeholder="首次绑定请设置，后续操作需验证" autocomplete="off">
            <div class="password-hint" id="passwordHint">⚠️ 请牢记密码，用于修改和清除绑定</div>
        </div>

        <div class="btn-group">
            <button id="bindBtn" class="btn btn-primary">🔒 绑定 / 更新校服主人</button>
            <button id="resetBtn" class="btn btn-reset">🗑️ 清除绑定</button>
        </div>

        <div class="alert" id="msgArea">
            <span>ℹ️</span> <span id="msgText"></span>
        </div>

        <div class="footer">
            © 2026 · 主人信息云端保存
        </div>
    </div>

    <!-- ======== 密码验证模态框（清除时使用） ======== -->
    <div class="modal-overlay" id="pwdModal">
        <div class="modal-box">
            <h3>🔐 验证密码</h3>
            <div class="modal-desc">请输入当前校服绑定的安全密码，以确认清除操作。</div>
            <input type="password" class="modal-input" id="modalPassword" placeholder="请输入安全密码" autocomplete="off">
            <div class="modal-error" id="modalError">❌ 密码错误，请重试</div>
            <div class="modal-actions">
                <button class="btn btn-cancel" id="modalCancel">取消</button>
                <button class="btn btn-confirm" id="modalConfirm">确认清除</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== JSONBin.io 配置 ====================
        const JSONBIN_API_KEY = '$2a$10$YENsP/yv0VlJEgD1QMEPne6rNuVqWBYq4AS16zBkuF7zZCkka21W2';
        const BIN_ID = '6a29156ada38895dfea51924';

        const BASE_URL = 'https://uw011021.github.io/trace/demo (12).html';

        // ==================== 校服ID ====================
        function getUniformId() {
            let urlParams = new URLSearchParams(window.location.search);
            let id = urlParams.get('uniform');
            if (id && id.trim() !== "") return id.trim();
            const newId = 'UNI' + Date.now() + '-' + Math.random().toString(36).substr(2, 8);
            let base = window.location.href.split('?')[0];
            let newUrl = base + '?uniform=' + encodeURIComponent(newId);
            window.history.replaceState({}, '', newUrl);
            return newId;
        }
        let currentUniformId = getUniformId();

        // ==================== UI 辅助 ====================
        function showMessage(text, isError = false) {
            const msgDiv = document.getElementById('msgArea');
            const msgSpan = document.getElementById('msgText');
            msgSpan.innerText = text;
            msgDiv.style.display = 'flex';
            msgDiv.style.background = isError ? '#fee8e8' : '#e0f2e9';
            msgDiv.style.color = isError ? '#b33' : '#166534';
            clearTimeout(msgDiv._timer);
            msgDiv._timer = setTimeout(() => { msgDiv.style.display = 'none'; }, 4000);
        }

        function setLoading(loading) {
            const bindBtn = document.getElementById('bindBtn');
            if (loading) {
                bindBtn.innerHTML = '<span class="loading"></span> 处理中...';
                bindBtn.disabled = true;
            } else {
                bindBtn.innerHTML = '🔒 绑定 / 更新校服主人';
                bindBtn.disabled = false;
            }
        }

        // ==================== 云端读写 ====================
        async function fetchAllData() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                if (!response.ok) throw new Error('读取失败');
                const data = await response.json();
                return data.record || {};
            } catch (error) {
                console.error('读取失败:', error);
                return null;
            }
        }

        async function saveAllData(data) {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify(data)
                });
                return response.ok;
            } catch (error) {
                console.error('保存失败:', error);
                return false;
            }
        }

        async function getUniformOwner() {
            const allData = await fetchAllData();
            if (allData && allData[currentUniformId]) return allData[currentUniformId];
            return null;
        }

        // ==================== 核心业务：绑定/更新 ====================
        async function saveUniformOwner(name, className, phone, password) {
            setLoading(true);
            try {
                // 1. 读取当前校服记录
                let allData = await fetchAllData();
                if (!allData) allData = {};
                const existing = allData[currentUniformId];

                // 2. 判断是首次绑定还是更新
                if (!existing) {
                    // ---- 首次绑定 ----
                    if (!password || password.length < 4) {
                        showMessage('⚠️ 首次绑定请设置至少4位安全密码', true);
                        setLoading(false);
                        return;
                    }
                    allData[currentUniformId] = {
                        name: name,
                        className: className || '',
                        phone: phone,
                        password: password,
                        lastUpdated: new Date().toISOString(),
                        uniformId: currentUniformId
                    };
                } else {
                    // ---- 更新绑定 ----
                    if (!password) {
                        showMessage('⚠️ 请输入当前安全密码以验证身份', true);
                        setLoading(false);
                        return;
                    }
                    if (password !== existing.password) {
                        showMessage('❌ 密码错误，无法更新信息', true);
                        setLoading(false);
                        return;
                    }
                    // 验证通过，更新信息（密码保持不变）
                    allData[currentUniformId] = {
                        ...existing,
                        name: name,
                        className: className || '',
                        phone: phone,
                        lastUpdated: new Date().toISOString()
                    };
                }

                // 3. 保存
                const success = await saveAllData(allData);
                if (success) {
                    showMessage(`✅ 绑定成功！校服主人：${name}`);
                    await refreshDisplay();
                } else {
                    showMessage('❌ 保存失败，请重试', true);
                }
            } catch (error) {
                showMessage('保存出错，请检查网络', true);
            } finally {
                setLoading(false);
            }
        }

        // ==================== 核心业务：清除（需密码验证） ====================
        async function clearUniformOwner(password) {
            setLoading(true);
            try {
                let allData = await fetchAllData();
                if (!allData) allData = {};
                const existing = allData[currentUniformId];

                if (!existing) {
                    showMessage('当前校服无绑定数据');
                    setLoading(false);
                    return;
                }

                if (!password || password !== existing.password) {
                    showMessage('❌ 密码错误，无法清除', true);
                    setLoading(false);
                    return;
                }

                delete allData[currentUniformId];
                const success = await saveAllData(allData);
                if (success) {
                    showMessage('🗑️ 已清除绑定');
                    await refreshDisplay();
                } else {
                    showMessage('清除失败，请重试', true);
                }
            } catch (error) {
                showMessage('清除出错，请检查网络', true);
            } finally {
                setLoading(false);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ==================== 刷新显示 ====================
        async function refreshDisplay() {
            const panel = document.getElementById('ownerInfoPanel');
            const nameInput = document.getElementById('ownerName');
            const classInput = document.getElementById('ownerClass');
            const phoneInput = document.getElementById('ownerPhone');
            const pwdInput = document.getElementById('ownerPassword');
            const pwdHint = document.getElementById('passwordHint');

            panel.innerHTML = '<div class="empty-state"><span class="loading"></span> 加载云端数据...</div>';
            const info = await getUniformOwner();

            if (info && info.name && info.name !== "") {
                panel.innerHTML = `
                        <div style="font-weight:600; color:#1a3a5c; margin-bottom:6px;">🏷️ 当前主人</div>
                        <div class="owner-detail"><span class="owner-label">👧 姓名</span><span class="owner-value">${escapeHtml(info.name)}</span></div>
                        <div class="owner-detail"><span class="owner-label">📚 班级</span><span class="owner-value">${escapeHtml(info.className || '未填')}</span></div>
                        <div class="owner-detail"><span class="owner-label">📱 联系方式</span><span class="owner-value">${escapeHtml(info.phone || '未填')}</span></div>
                        <div class="owner-detail" style="font-size:12px; color:#6a8a9a;"><span class="owner-label">🕒 更新</span><span class="owner-value">${new Date(info.lastUpdated).toLocaleString()}</span></div>
                    `;
                nameInput.value = info.name;
                classInput.value = info.className || '';
                phoneInput.value = info.phone || '';
                pwdInput.value = '';
                pwdInput.placeholder = '请输入当前密码以修改信息';
                pwdHint.textContent = '🔑 输入当前密码验证身份，密码不会变更';
                pwdHint.style.color = '#2c5f8a';
            } else {
                panel.innerHTML =
                    `<div class="empty-state">⚠️ 当前校服尚未绑定主人。<br>填写下方表单并点击「绑定」，他人扫码可联系归还。</div>`;
                nameInput.value = '';
                classInput.value = '';
                phoneInput.value = '';
                pwdInput.value = '';
                pwdInput.placeholder = '首次绑定请设置安全密码 (至少4位)';
                pwdHint.textContent = '⚠️ 请牢记密码，用于后续修改和清除绑定';
                pwdHint.style.color = '#7a9aaa';
            }
        }

        // ==================== 绑定事件 ====================
        async function bindUniform() {
            const name = document.getElementById('ownerName').value.trim();
            const className = document.getElementById('ownerClass').value.trim();
            const phone = document.getElementById('ownerPhone').value.trim();
            const password = document.getElementById('ownerPassword').value.trim();

            if (!name) { showMessage('请填写学生姓名', true); return; }
            if (!phone) { showMessage('请填写联系电话', true); return; }
            if (phone.length < 6) { showMessage('请填写有效号码', true); return; }

            // 检查是否已绑定，决定密码的必填逻辑
            const info = await getUniformOwner();
            if (!info) {
                // 首次绑定：密码必填且至少4位
                if (!password || password.length < 4) {
                    showMessage('⚠️ 首次绑定请设置至少4位安全密码', true);
                    return;
                }
            } else {
                // 更新：密码必填（用于验证）
                if (!password) {
                    showMessage('⚠️ 请输入当前安全密码以验证身份', true);
                    return;
                }
            }

            await saveUniformOwner(name, className, phone, password);
        }

        // ==================== 清除按钮 -> 弹出模态框 ====================
        function showPwdModal() {
            const modal = document.getElementById('pwdModal');
            const input = document.getElementById('modalPassword');
            const error = document.getElementById('modalError');
            input.value = '';
            error.classList.remove('show');
            modal.classList.add('active');
            setTimeout(() => input.focus(), 100);
        }

        function hidePwdModal() {
            document.getElementById('pwdModal').classList.remove('active');
            document.getElementById('modalError').classList.remove('show');
            document.getElementById('modalPassword').value = '';
        }

        // 确认清除（从模态框获取密码）
        async function confirmClear() {
            const input = document.getElementById('modalPassword');
            const error = document.getElementById('modalError');
            const password = input.value.trim();

            if (!password) {
                error.textContent = '❌ 请输入安全密码';
                error.classList.add('show');
                return;
            }

            // 验证密码
            const info = await getUniformOwner();
            if (!info) {
                showMessage('当前校服无绑定数据');
                hidePwdModal();
                return;
            }

            if (password !== info.password) {
                error.textContent = '❌ 密码错误，请重试';
                error.classList.add('show');
                input.value = '';
                setTimeout(() => input.focus(), 100);
                return;
            }

            // 密码正确，执行清除
            hidePwdModal();
            await clearUniformOwner(password);
        }

        // ==================== 二维码（不变） ====================
        let qr = null;

        function generateQRCode() {
            const qrContent = BASE_URL + '?uniform=' + encodeURIComponent(currentUniformId);
            const displaySpan = document.getElementById('uniformIdDisplay');
            displaySpan.innerHTML = `校服码: ${currentUniformId.substring(0, 14)}...`;

            const container = document.getElementById('qrcode');
            container.innerHTML = "";
            try {
                qr = new QRCode(container, {
                    text: qrContent,
                    width: 160,
                    height: 160,
                    colorDark: "#1a3a5c",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            } catch (e) {
                container.innerHTML =
                    `<div style="padding:12px; font-size:13px;">二维码生成失败，<a href="${qrContent}" target="_blank">点击链接</a></div>`;
            }
        }

        // ==================== 初始化 ====================
        async function init() {
            let hasId = new URLSearchParams(window.location.search).get('uniform');
            if (!hasId) {
                let base = window.location.href.split('?')[0];
                let newUrl = base + '?uniform=' + encodeURIComponent(currentUniformId);
                window.history.replaceState({}, '', newUrl);
            }
            generateQRCode();
            await refreshDisplay();

            document.getElementById('bindBtn').addEventListener('click', bindUniform);
            document.getElementById('resetBtn').addEventListener('click', showPwdModal);

            // 模态框事件
            document.getElementById('modalCancel').addEventListener('click', hidePwdModal);
            document.getElementById('modalConfirm').addEventListener('click', confirmClear);
            document.getElementById('pwdModal').addEventListener('click', function(e) {
                if (e.target === this) hidePwdModal();
            });
            document.getElementById('modalPassword').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') confirmClear();
            });
        }

        init();
    </script>

</body>
</html>
